<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR P2P Transfer | Receiver</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body class="receiver-bg">
    <div class="container">
        <header>
            <h1>📥 Receive Files</h1>
            <p id="connectionStatus">Connecting to sender...</p>
        </header>

        <main>
            <!-- State: Connecting -->
            <section class="card" id="loadingCard">
                <div class="spinner"></div>
                <p class="center-text">Establishing secure P2P connection...</p>
            </section>

            <!-- State: Receiving Files -->
            <section class="card" id="filesCard" style="display: none;">
                <h2>Receiving Stream</h2>
                <div id="transferLog" class="receiver-file-list">
                    <!-- Active transfers appear here -->
                </div>
            </section>

            <!-- State: Error -->
            <section class="card" id="errorCard" style="display: none;">
                <p class="center-text" id="errorMessage">Connection failed.</p>
                <button class="btn-primary" id="retryBtn" type="button">Retry</button>
            </section>
        </main>
    </div>
    <script src="js/receiver.js"></script>
</body>
</html>

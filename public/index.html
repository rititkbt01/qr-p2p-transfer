<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR P2P Transfer | Sender</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- PeerJS for WebRTC (Handles the complex P2P handshake) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📤 QR P2P Transfer</h1>
            <p>Direct device-to-device transfer. No server, no cloud, total privacy.</p>
        </header>

        <main>
            <!-- STEP 1: Connection Status & QR -->
            <section class="card" id="connectionCard">
                <h2>1. Establish Connection</h2>
                <p class="instruction">Generating secure P2P link...</p>
                <div class="qr-wrapper" id="qrWrapper" style="display:none;">
                    <div id="qrcode"></div>
                </div>
                <p class="session-info" id="peerIdDisplay" style="display:none;">ID: <strong>—</strong></p>
                <p class="url-display" id="urlDisplay" style="display:none;">—</p>
            </section>

            <!-- STEP 2: File Selection (Hidden until connected) -->
            <section class="card" id="fileCard" style="display: none;">
                <h2>2. Select Files to Send</h2>
                <div class="mode-toggle">
                    <button class="toggle-btn active" id="btnFiles" type="button">📄 Files</button>
                    <button class="toggle-btn" id="btnFolder" type="button">📁 Folder</button>
                </div>

                <div class="drop-zone" id="dropZone">
                    <input type="file" id="fileInput" multiple hidden>
                    <input type="file" id="folderInput" webkitdirectory hidden>
                    <label for="fileInput" class="drop-label" id="dropLabel">
                        <span class="icon">📄</span>
                        <span id="dropText">Click to browse or drag & drop files here</span>
                    </label>
                </div>
                <div id="fileList" class="file-list"></div>
            </section>

            <!-- Status Log -->
            <section class="card">
                <h2>Status</h2>
                <div id="statusLog" class="status-log">
                    <p>⏳ Initializing PeerJS...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="js/sender.js"></script>
</body>
</html>

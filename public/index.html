<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR P2P Transfer</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📤 QR P2P Transfer</h1>
            <p>Direct device-to-device. Send & Receive simultaneously.</p>
        </header>

        <main>
            <!-- 1. CONNECTION CARD -->
            <section class="card" id="connectionCard">
                <h2>1. Establish Connection</h2>
                <div id="hostView" style="display: none;">
                    <p class="instruction">Scan this code with the other device.</p>
                    <div class="qr-wrapper" id="qrWrapper" style="display:none;">
                        <div id="qrcode"></div>
                    </div>
                    <p class="session-info">Peer ID: <strong id="peerIdDisplay">—</strong></p>
                </div>
                
                <div id="clientView" style="display: none;">
                    <div class="spinner"></div>
                    <p class="center-text" id="connectionStatus">Connecting to host...</p>
                </div>
            </section>

            <!-- 2. SEND FILES CARD (Hidden until connected) -->
            <section class="card" id="sendCard" style="display: none;">
                <h2>2. Send Files or Folder</h2>
                
                <!-- NEW: Mode Toggle Buttons -->
                <div class="mode-toggle">
                    <button class="toggle-btn active" id="btnFiles" type="button">📄 Files</button>
                    <button class="toggle-btn" id="btnFolder" type="button">📁 Folder</button>
                </div>

                <div class="drop-zone" id="dropZone">
                    <!-- Standard File Input -->
                    <input type="file" id="fileInput" multiple hidden>
                    <!-- NEW: Folder Input (webkitdirectory allows folder selection) -->
                    <input type="file" id="folderInput" webkitdirectory hidden>
                    
                    <label for="fileInput" class="drop-label" id="dropLabel">
                        <span class="icon">📄</span>
                        <span id="dropText">Click to browse or drag & drop files here</span>
                    </label>
                </div>
                <div id="fileList" class="file-list"></div>
            </section>

            <!-- 3. RECEIVE FILES CARD (Hidden until files arrive) -->
            <section class="card" id="receiveCard" style="display: none;">
                <h2>3. Receiving Files</h2>
                <div id="transferLog" class="receiver-file-list"></div>
            </section>

            <!-- STATUS LOG -->
            <section class="card">
                <h2>Status</h2>
                <div id="statusLog" class="status-log">
                    <p> Initializing...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR P2P Transfer</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📤</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📤 QR P2P Transfer</h1>
            <p>Direct device-to-device. No server. No limits.</p>
        </header>

        <main>
            <!-- TABS -->
            <nav class="tabs">
                <button class="tab-btn active" data-tab="transfer">Transfer</button>
                <button class="tab-btn" data-tab="saved">Saved</button>
                <button class="tab-btn" data-tab="history">History</button>
            </nav>

            <!-- TAB 1: TRANSFER -->
            <div id="tab-transfer" class="tab-content active">
                
                <!-- Connection Card -->
                <section class="card" id="connectionCard">
                    <h2>1. Connect</h2>
                    
                    <div id="hostView" style="display: none;">
                        <div class="room-code-section">
                            <p class="room-label">Your Room Code</p>
                            <div class="room-code-display" id="roomCodeDisplay">------</div>
                            <div class="room-actions">
                                <button id="copyCodeBtn" class="btn-action">📋 Copy</button>
                                <button id="shareCodeBtn" class="btn-action">🔗 Share</button>
                            </div>
                        </div>
                        <p class="instruction">Share code or scan QR</p>
                        <div class="qr-wrapper" id="qrWrapper" style="display:none;">
                            <div id="qrcode"></div>
                        </div>
                    </div>
                    
                    <div id="clientView" style="display: none;">
                        <div class="client-connect">
                            <p class="center-text" id="connectionStatus">Enter room code to connect</p>
                            <div class="room-input-group" id="roomInputGroup">
                                <input type="text" id="roomCodeInput" placeholder="6-DIGIT CODE" maxlength="6" class="room-input" autocomplete="off">
                                <button id="joinRoomBtn" class="btn-primary">Join</button>
                            </div>
                            <div class="spinner" id="clientSpinner" style="display:none;"></div>
                        </div>
                    </div>
                </section>

                <!-- Send Card -->
                <section class="card" id="sendCard" style="display: none;">
                    <h2>2. Send Files</h2>
                    <div class="mode-toggle">
                        <button class="toggle-btn active" id="btnFiles">📄 Files</button>
                        <button class="toggle-btn" id="btnFolder">📁 Folder</button>
                    </div>
                    <div class="drop-zone" id="dropZone">
                        <input type="file" id="fileInput" multiple hidden>
                        <input type="file" id="folderInput" webkitdirectory hidden>
                        <label for="fileInput" class="drop-label" id="dropLabel">
                            <span class="icon">📄</span>
                            <span id="dropText">Tap to select files</span>
                        </label>
                    </div>
                    <div id="fileList" class="file-list"></div>
                </section>

                <!-- Receive Card -->
                <section class="card" id="receiveCard" style="display: none;">
                    <div class="card-header-row">
                        <h2>3. Receiving</h2>
                        <button id="downloadAllBtn" class="btn-action" style="display:none;">⬇️ Download All</button>
                    </div>
                    <div id="transferLog" class="receiver-file-list"></div>
                </section>
            </div>

            <!-- TAB 2: SAVED -->
            <div id="tab-saved" class="tab-content">
                <section class="card">
                    <h2>💾 Saved Devices</h2>
                    <p class="hint" id="noDevicesHint">No saved devices yet.</p>
                    <div id="savedDevicesList" class="saved-devices-list"></div>
                </section>
            </div>

            <!-- TAB 3: HISTORY -->
            <div id="tab-history" class="tab-content">
                <section class="card">
                    <div class="card-header-row">
                        <h2>🕒 Transfer History</h2>
                        <button id="clearHistoryBtn" class="btn-action">🗑️ Clear</button>
                    </div>
                    <div id="historyList" class="history-list"></div>
                </section>
            </div>

        </main>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
        }
    </script>
</body>
</html>
